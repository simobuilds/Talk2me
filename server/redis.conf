# Persist data to /data (mounted from host)
dir /data

# Enable AOF (safer for durability)
appendonly yes
appendfilename "appendonly.aof"

# RDB snapshots (kept as sensible defaults)
save 900 1
save 300 10
save 60 10000

# Recommended: disable supervised in Docker container
supervised no

# bind 0.0.0.0 to accept connections from host
bind 0.0.0.0
